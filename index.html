<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus UP — Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;900&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050304;
            background-image: 
                radial-gradient(circle at 50% -20%, #2a080c 0%, transparent 60%),
                radial-gradient(circle at 10% 110%, #150204 0%, transparent 50%);
            color: #f3f4f6;
            overflow-x: hidden;
        }

        /* Премиальное свечение */
        .glow-card {
            box-shadow: 0 0 30px rgba(220, 38, 38, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        
        .glow-button {
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.4);
        }

        /* Плавные анимации в стиле TG Premium */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.03); }
        }
        .animate-pulse-glow {
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes wheelSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(1800deg); }
        }
        .spinning-wheel {
            animation: wheelSpin 2.5s cubic-bezier(0.15, 0.85, 0.25, 1) forwards;
        }

        /* Стеклянный эффект */
        .glass-panel {
            background: rgba(18, 11, 13, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-24 select-none">

    <!-- Верхняя шапка (Glassmorphism) -->
    <header class="w-full px-5 py-4 flex justify-between items-center glass-panel sticky top-0 z-40 border-b border-red-950/30">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-red-600 to-rose-500 flex items-center justify-center font-black text-white shadow-lg shadow-red-900/50 animate-float">
                N
            </div>
            <div>
                <span class="text-base font-black tracking-wider text-white">NEXUS</span>
                <span class="text-[9px] bg-red-500/20 text-red-400 border border-red-500/30 px-1.5 py-0.5 rounded-full font-bold uppercase ml-1">PRO</span>
            </div>
        </div>
        
        <div class="flex items-center gap-2 glass-panel px-3.5 py-1.5 rounded-2xl border border-red-900/30">
            <span class="text-amber-400 text-sm font-black" id="headerBalance">0 ⭐</span>
            <button onclick="openDepositModal()" class="w-6 h-6 bg-red-600 hover:bg-red-500 rounded-full flex items-center justify-center text-white font-bold text-xs transition shadow-md shadow-red-900/50 active:scale-95">+</button>
        </div>
    </header>

    <!-- Основной интерфейс -->
    <main class="w-full max-w-md mx-auto p-4 flex flex-col gap-5 my-auto">

        <!-- Карточка баланса с живым фоном -->
        <div class="glass-panel rounded-3xl p-6 glow-card relative overflow-hidden flex flex-col gap-4">
            <div class="absolute -right-12 -bottom-12 w-40 h-40 bg-red-600/15 rounded-full blur-3xl pointer-events-none animate-pulse-glow"></div>
            
            <div class="flex justify-between items-center relative z-10">
                <div>
                    <div class="flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <p class="text-[11px] text-zinc-400 uppercase tracking-widest font-bold">Основной счет</p>
                    </div>
                    <h1 class="text-4xl font-black text-white mt-1 tracking-tight" id="mainBalance">0 ⭐</h1>
                </div>
                <div class="flex flex-col gap-2">
                    <button onclick="openDepositModal()" class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white px-4 py-2.5 rounded-2xl font-bold text-xs transition glow-button active:scale-95">Пополнить</button>
                    <button onclick="openWithdrawModal()" class="glass-panel hover:bg-zinc-800/80 text-zinc-300 px-4 py-2.5 rounded-2xl font-bold text-xs transition border border-zinc-700/50 active:scale-95">Вывод</button>
                </div>
            </div>
        </div>

        <!-- Игровой модуль: Рулетка -->
        <div class="glass-panel rounded-3xl p-6 glow-card flex flex-col items-center gap-5 relative">
            <div class="w-full flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-lg">🎯</span>
                    <h2 class="font-bold text-sm tracking-wide text-zinc-200">Колесо Удачи</h2>
                </div>
                <span class="text-[10px] text-red-400 bg-red-950/60 border border-red-900/40 px-2.5 py-1 rounded-xl font-bold tracking-wide">MULTIX</span>
            </div>

            <!-- Премиальное колесо с анимацией -->
            <div class="relative w-36 h-36 my-1 flex items-center justify-center">
                <!-- Указатель -->
                <div class="absolute -top-3 z-20 w-5 h-5 bg-red-500 rotate-45 border-2 border-zinc-950 shadow-lg shadow-red-500/50"></div>
                
                <!-- Внешнее кольцо свечения -->
                <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-red-600/30 to-rose-500/10 blur-md animate-pulse-glow"></div>

                <!-- Колесо -->
                <div id="rouletteWheel" class="w-32 h-32 rounded-full border-2 border-red-500/40 bg-gradient-to-br from-zinc-900 via-[#14080a] to-red-950 flex items-center justify-center shadow-2xl relative overflow-hidden">
                    <div class="absolute inset-0 opacity-20 bg-[radial-gradient(#ef4444_1px,transparent_1px)] [background-size:8px_8px]"></div>
                    <div class="w-12 h-12 rounded-full bg-zinc-950 border border-red-500/50 flex items-center justify-center shadow-inner z-10">
                        <span class="text-xs font-black text-red-500 animate-float">⭐</span>
                    </div>
                </div>
            </div>
            
            <div class="w-full flex flex-col gap-2">
                <label class="text-xs text-zinc-400 font-semibold pl-1">Сумма ставки (⭐)</label>
                <input type="number" id="betAmount" value="100" class="w-full bg-black/50 border border-zinc-800/80 rounded-2xl p-3.5 text-white font-bold text-sm focus:outline-none focus:border-red-500 transition shadow-inner">
            </div>

            <div class="w-full flex flex-col gap-2">
                <label class="text-xs text-zinc-400 font-semibold pl-1">Выбрать множитель</label>
                <select id="multiplier" class="w-full bg-black/50 border border-zinc-800/80 rounded-2xl p-3.5 text-white font-bold text-sm focus:outline-none focus:border-red-500 transition cursor-pointer">
                    <option value="2" data-chance="48">x2 (Шанс 48%)</option>
                    <option value="5" data-chance="19">x5 (Шанс 19%)</option>
                    <option value="10" data-chance="9">x10 (Шанс 9%)</option>
                </select>
            </div>

            <button id="betButton" onclick="makeBet()" class="w-full bg-gradient-to-r from-red-600 via-rose-600 to-red-700 hover:from-red-500 hover:to-rose-500 text-white font-black py-4 rounded-2xl transition glow-button active:scale-98 tracking-wider uppercase text-sm">
                Крутить рулетку
            </button>

            <div id="resultLog" class="text-center text-xs font-bold h-5 tracking-wide"></div>
        </div>

    </main>

    <!-- Нижняя панель навигации (Dock Style) -->
    <nav class="fixed bottom-3 left-4 right-4 glass-panel rounded-3xl py-3 px-6 flex justify-around items-center z-50 border border-red-950/40 shadow-2xl">
        <a href="#" class="flex flex-col items-center gap-1 text-red-500 transition transform hover:scale-105">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span class="text-[10px] font-bold">Главная</span>
        </a>
        <a href="#" onclick="openDepositModal(); return false;" class="flex flex-col items-center gap-1 text-zinc-400 hover:text-zinc-200 transition transform hover:scale-105">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            <span class="text-[10px] font-semibold">Касса</span>
        </a>
        <a href="#" onclick="openWithdrawModal(); return false;" class="flex flex-col items-center gap-1 text-zinc-400 hover:text-zinc-200 transition transform hover:scale-105">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a1 1 0 11-2 0 1 1 0 012 0z"/></svg>
            <span class="text-[10px] font-semibold">Вывод</span>
        </a>
    </nav>

    <!-- Модальное окно вывода -->
    <div id="withdrawModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="glass-panel border border-red-900/40 rounded-3xl p-6 w-full max-w-xs flex flex-col gap-4 glow-card">
            <div class="text-center">
                <h3 class="font-extrabold text-lg text-white">Вывод средств</h3>
                <p class="text-[11px] text-zinc-400 mt-0.5">Заявка уйдет администратору</p>
            </div>
            <input type="number" id="withdrawAmount" placeholder="Сумма звезд" class="w-full bg-black/60 border border-zinc-800 rounded-2xl p-3.5 text-white font-bold text-sm focus:outline-none focus:border-red-500">
            <button onclick="requestWithdraw()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3.5 rounded-2xl transition glow-button active:scale-95 text-xs uppercase tracking-wider">Отправить заявку</button>
            <button onclick="closeWithdrawModal()" class="text-zinc-500 text-xs hover:text-zinc-300 transition text-center font-semibold">Отмена</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const telegramId = tg.initDataUnsafe?.user?.id || "test_user_123";
        const API_URL = "https://nexus-up-backend.onrender.com/api";

        async function fetchBalance() {
            try {
                const res = await fetch(`${API_URL}/balance/${telegramId}`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('mainBalance').innerText = `${data.balance} ⭐`;
                    document.getElementById('headerBalance').innerText = `${data.balance} ⭐`;
                }
            } catch (e) {
                console.error("Ошибка загрузки баланса");
            }
        }

        async function makeBet() {
            const amount = parseInt(document.getElementById('betAmount').value);
            const select = document.getElementById('multiplier');
            const multiplier = parseFloat(select.value);
            const winChance = parseFloat(select.options[select.selectedIndex].getAttribute('data-chance'));
            const wheel = document.getElementById('rouletteWheel');
            const betBtn = document.getElementById('betButton');
            const log = document.getElementById('resultLog');

            if (!amount || amount <= 0) {
                alert("Введите корректную сумму ставки");
                return;
            }

            betBtn.disabled = true;
            wheel.classList.add('spinning-wheel');
            log.innerHTML = `<span class="text-amber-400 animate-pulse">⚡ Колесо вращается...</span>`;

            try {
                const res = await fetch(`${API_URL}/upgrade`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId, amount, multiplier, winChance })
                });
                const data = await res.json();
                
                setTimeout(() => {
                    wheel.classList.remove('spinning-wheel');
                    betBtn.disabled = false;

                    if (data.success) {
                        document.getElementById('mainBalance').innerText = `${data.newBalance} ⭐`;
                        document.getElementById('headerBalance').innerText = `${data.newBalance} ⭐`;
                        if (data.win) {
                            log.innerHTML = `<span class="text-emerald-400 font-extrabold text-sm">🎉 Победа! +${data.payout} ⭐</span>`;
                        } else {
                            log.innerHTML = `<span class="text-rose-500 font-extrabold text-sm">😢 Проигрыш (-${amount} ⭐)</span>`;
                        }
                    } else {
                        alert(data.error);
                        log.innerHTML = "";
                    }
                }, 2500);

            } catch (e) {
                wheel.classList.remove('spinning-wheel');
                betBtn.disabled = false;
                alert("Ошибка соединения с сервером");
                log.innerHTML = "";
            }
        }

        function openWithdrawModal() { document.getElementById('withdrawModal').classList.remove('hidden'); }
        function closeWithdrawModal() { document.getElementById('withdrawModal').classList.add('hidden'); }

        async function requestWithdraw() {
            const amount = parseInt(document.getElementById('withdrawAmount').value);
            if (!amount || amount < 1) {
                alert("Введите сумму для вывода");
                return;
            }
            try {
                const res = await fetch(`${API_URL}/withdraw`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId, amount })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('mainBalance').innerText = `${data.newBalance} ⭐`;
                    document.getElementById('headerBalance').innerText = `${data.newBalance} ⭐`;
                    alert("Заявка на вывод успешно отправлена администратору!");
                    closeWithdrawModal();
                } else {
                    alert(data.error);
                }
            } catch (e) {
                alert("Ошибка отправки заявки");
            }
        }

        async function openDepositModal() {
            const amount = prompt("Введите количество звезд для пополнения:", "100");
            if (!amount) return;
            try {
                const res = await fetch(`${API_URL}/create-invoice`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId, amount: parseInt(amount) })
                });
                const data = await res.json();
                if (data.success && data.data?.invoice_url) {
                    window.open(data.data.invoice_url, '_blank');
                } else {
                    alert("Счет успешно создан в боте!");
                }
            } catch (e) {
                alert("Ошибка создания инвойса");
            }
        }

        fetchBalance();
    </script>
</body>
</html>
