<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0c090a;
            background-image: radial-gradient(circle at 50% 0%, #1a0f12 0%, #0c090a 70%);
        }
        .card-glow {
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.15);
        }
    </style>
</head>
<body class="text-zinc-100 font-sans min-h-screen flex flex-col justify-between pb-20 select-none">

    <!-- Верхняя шапка -->
    <header class="w-full p-4 flex justify-between items-center border-b border-red-950/40 bg-black/40 backdrop-blur-md">
        <div class="flex items-center gap-2">
            <span class="text-xl font-black tracking-wider text-white">NEXUS</span>
            <span class="bg-red-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-md uppercase">App</span>
        </div>
        <div class="flex items-center gap-2 bg-zinc-900/80 border border-red-900/50 px-3 py-1.5 rounded-full card-glow">
            <span class="text-red-500 font-bold" id="headerBalance">0 ⭐</span>
            <button onclick="openDepositModal()" class="w-6 h-6 bg-red-600 hover:bg-red-500 rounded-full flex items-center justify-center text-white font-bold text-sm transition">+</button>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="w-full max-w-md mx-auto p-4 flex flex-col gap-4">

        <!-- Карточка баланса и профиля -->
        <div class="bg-gradient-to-b from-zinc-900/90 to-zinc-950/90 border border-red-600/30 rounded-3xl p-6 shadow-2xl card-glow flex flex-col gap-4 relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-32 h-32 bg-red-600/10 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-xs text-zinc-500 uppercase tracking-widest font-semibold">Баланс</p>
                    <h1 class="text-4xl font-black text-white mt-1" id="mainBalance">0 ⭐</h1>
                </div>
                <div class="flex flex-col gap-2">
                    <button onclick="openDepositModal()" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-xl font-bold text-xs transition shadow-lg shadow-red-900/30">Пополнить</button>
                    <button onclick="openWithdrawModal()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 py-2 rounded-xl font-bold text-xs transition border border-zinc-700">Вывод</button>
                </div>
            </div>
        </div>

        <!-- Игровой блок (Рулетка / Апгрейд) -->
        <div class="bg-zinc-900/80 border border-zinc-800/80 rounded-3xl p-5 shadow-xl flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <h2 class="font-bold text-base flex items-center gap-2">🎯 Рулетка x</h2>
                <span class="text-xs text-red-400 bg-red-950/50 border border-red-900/50 px-2 py-0.5 rounded-lg">Live</span>
            </div>
            
            <div class="flex flex-col gap-1.5">
                <label class="text-xs text-zinc-400 font-medium">Сумма ставки</label>
                <input type="number" id="betAmount" value="100" class="bg-black/60 border border-zinc-800 rounded-2xl p-3 text-white font-bold focus:outline-none focus:border-red-600 transition">
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs text-zinc-400 font-medium">Множитель</label>
                <select id="multiplier" class="bg-black/60 border border-zinc-800 rounded-2xl p-3 text-white font-bold focus:outline-none focus:border-red-600 transition">
                    <option value="2" data-chance="48">x2 (Шанс 48%)</option>
                    <option value="5" data-chance="19">x5 (Шанс 19%)</option>
                    <option value="10" data-chance="9">x10 (Шанс 9%)</option>
                </select>
            </div>

            <button onclick="makeBet()" class="w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-extrabold py-3.5 rounded-2xl transition shadow-lg shadow-red-900/40 active:scale-98">
                Сделать ставку
            </button>

            <div id="resultLog" class="text-center text-sm font-semibold h-6"></div>
        </div>

    </main>

    <!-- Нижняя навигация -->
    <nav class="fixed bottom-0 left-0 right-0 bg-black/90 border-t border-red-950/40 backdrop-blur-lg py-2.5 px-6 flex justify-around items-center z-50">
        <a href="#" class="flex flex-col items-center gap-1 text-red-500">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span class="text-[10px] font-semibold">Главная</span>
        </a>
        <a href="#" onclick="openDepositModal(); return false;" class="flex flex-col items-center gap-1 text-zinc-500 hover:text-zinc-300 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
            <span class="text-[10px] font-semibold">Касса</span>
        </a>
        <a href="#" onclick="openWithdrawModal(); return false;" class="flex flex-col items-center gap-1 text-zinc-500 hover:text-zinc-300 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a1 1 0 11-2 0 1 1 0 012 0z"/></svg>
            <span class="text-[10px] font-semibold">Вывод</span>
        </a>
    </nav>

    <!-- Модальное окно вывода -->
    <div id="withdrawModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="bg-zinc-900 border border-red-900/50 rounded-3xl p-6 w-full max-w-xs flex flex-col gap-4 card-glow">
            <h3 class="font-bold text-lg text-center">Запрос на вывод</h3>
            <input type="number" id="withdrawAmount" placeholder="Количество звезд" class="bg-black/60 border border-zinc-800 rounded-2xl p-3 text-white font-bold focus:outline-none focus:border-red-600">
            <button onclick="requestWithdraw()" class="bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-2xl transition shadow-lg shadow-red-900/30">Отправить заявку</button>
            <button onclick="closeWithdrawModal()" class="text-zinc-500 text-xs hover:text-zinc-300 transition text-center">Отмена</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const telegramId = tg.initDataUnsafe?.user?.id || "test_user_123";
        const API_URL = "https://nexus-up-backend.onrender.com/api"; // Убедись, что здесь твой адрес с Render

        async function fetchBalance() {
            try {
                const res = await fetch(`${API_URL}/balance/${telegramId}`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('mainBalance').innerText = `${data.balance} ⭐`;
                    document.getElementById('headerBalance').innerText = `${data.balance} ⭐`;
                }
            } catch (e) {
                console.error("Ошибка загрузки баланса");
            }
        }

        async function makeBet() {
            const amount = parseInt(document.getElementById('betAmount').value);
            const select = document.getElementById('multiplier');
            const multiplier = parseFloat(select.value);
            const winChance = parseFloat(select.options[select.selectedIndex].getAttribute('data-chance'));

            try {
                const res = await fetch(`${API_URL}/upgrade`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId, amount, multiplier, winChance })
                });
                const data = await res.json();
                
                if (data.success) {
                    document.getElementById('mainBalance').innerText = `${data.newBalance} ⭐`;
                    document.getElementById('headerBalance').innerText = `${data.newBalance} ⭐`;
                    const log = document.getElementById('resultLog');
                    if (data.win) {
                        log.innerHTML = `<span class="text-green-400 font-bold">Победа! +${data.payout} ⭐</span>`;
                    } else {
                        log.innerHTML = `<span class="text-red-500 font-bold">Проигрыш :(</span>`;
                    }
                } else {
                    alert(data.error);
                }
            } catch (e) {
                alert("Ошибка соединения с сервером");
            }
        }

        function openWithdrawModal() { document.getElementById('withdrawModal').classList.remove('hidden'); }
        function closeWithdrawModal() { document.getElementById('withdrawModal').classList.add('hidden'); }

        async function requestWithdraw() {
            const amount = parseInt(document.getElementById('withdrawAmount').value);
            try {
                const res = await fetch(`${API_URL}/withdraw`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId, amount })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('mainBalance').innerText = `${data.newBalance} ⭐`;
                    document.getElementById('headerBalance').innerText = `${data.newBalance} ⭐`;
                    alert("Заявка на вывод отправлена администратору!");
                    closeWithdrawModal();
                } else {
                    alert(data.error);
                }
            } catch (e) {
                alert("Ошибка отправки заявки");
            }
        }

        async function openDepositModal() {
            const amount = prompt("Введите количество звезд для пополнения:", "100");
            if (!amount) return;
            try {
                const res = await fetch(`${API_URL}/create-invoice`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId, amount: parseInt(amount) })
                });
                const data = await res.json();
                if (data.success && data.data?.invoice_url) {
                    window.open(data.data.invoice_url, '_blank');
                } else {
                    alert("Счет успешно создан в боте!");
                }
            } catch (e) {
                alert("Ошибка создания инвойса");
            }
        }

        fetchBalance();
    </script>
</body>
</html>
